services:
  esp32-vibe-coder:
    image: esp32-vibe-coder:latest
    container_name: esp32-vibe-coder
    restart: unless-stopped
    network_mode: host

  esp32-compiler:
    image: esp32-compiler:latest
    container_name: esp32-compiler
    restart: unless-stopped
    network_mode: host
    environment:
      BUILD_BASE: /tmp/builds
      REMOTE_OTA_DIR: /tmp/vibeboard-remote-ota
    volumes:
      - ${VIBEBOARD_BUILD_CACHE:-/home/wq/vibeboard-build-cache}:/tmp/builds
      - ${VIBEBOARD_REMOTE_OTA_STATE:-/home/wq/vibeboard-remote-ota}:/tmp/vibeboard-remote-ota

  nordic-compiler:
    image: nordic-compiler:latest
    container_name: nordic-compiler
    restart: unless-stopped
    network_mode: host
    environment:
      NORDIC_BUILD_BASE: /tmp/nordic-builds
    volumes:
      - ${VIBEBOARD_NORDIC_BUILD_CACHE:-/home/wq/vibeboard-nordic-build-cache}:/tmp/nordic-builds
      - ${NORDIC_TOOLCHAIN_DIR:-/home/wq/nordic-toolchain/ncs}:/opt/ncs:ro
      - ${ZEPHYR_SDK_DIR:-/home/wq/nordic-toolchain/zephyr-sdk-0.17.4}:/opt/zephyr-sdk-0.17.4:ro
